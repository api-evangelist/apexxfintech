        http_java_enabled:
          type: string
          description: Indicates whether the customer’s browser supports and has Java enabled (true / false).This helps assess the browser environment and can be used in device fingerprinting or fraud risk checks.
        http_java_script_enabled:
          type: string
          description: Indicates whether the customer’s browser has JavaScript enabled (true / false).Helps determine if the environment supports interactive web features and can be used for fraud/risk evaluation.
        http_browser_language:
          type: string
          description: The default language setting of the customer’s browser (e.g., "en-US", "fr-FR").Useful for localization, risk analysis, and understanding customer preferences.
        http_screen_height:
          type: string
          description: The height of the customer’s device screen in pixels (e.g., 1080).Often captured to verify the device profile.
        http_screen_width:
          type: string
          description: The width of the customer’s device screen in pixels (e.g., 1920).Used together with http_screen_height to describe display resolution.
        http_time_difference:
          type: string
          description: The time zone offset (in minutes or hours) between the customer’s local device time and UTC (e.g., +330 for IST).Helps in detecting anomalies if device time doesn’t match geolocation.
        customer_ip:
          type: string
          description: The IP address of the customer’s device at the time of transaction (IPv4 or IPv6).Commonly used for geolocation and fraud detection.
        http_accept_browser_value:
          type: string
          description: 'The raw Accept header value sent by the browser


