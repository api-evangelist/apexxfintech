  '/api/payment          ':
    post:
      tags:
      - Alternative Payment Methods
      summary: Dragonpay Payment
      description: 'Make a transaction with dragonpay request


        NOTE: In the response of payments API, merchant will receive a redirection URL where merchant has to redirect the customer."


        Customer will perform the authentication process on the redirection server and will be returned back to merchant server after authentication is completed."


        The status of the transaction at this stage will be "AUTHORISED".


        The transaction takes upto 120 seconds to get updated in Apexx system after authentication process is completed.


        Merchant can receive the final status of the transaction via webhook once the transaction is updated in APEXX system or you can use get_transaction API to get the transaction status after 120 seconds.'
      operationId: dragonPayPaymentUsingPOST
      parameters:
      - name: X-APIKEY
        in: header
        description: X-APIKEY
        required: true
        schema:
          type: string
      responses:
        '200':
