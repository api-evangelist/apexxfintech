components:
  schemas:
    RuleDTO:
      type: object
      properties:
        decision:
          type: string
        name:
          type: string
    CybersourceDecisionManagerResponse:
      type: object
      properties:
        clientReferenceInformation:
          $ref: '#/components/schemas/ClientReferenceInformationDTO'
        consumerAuthenticationInformation:
          $ref: '#/components/schemas/ConsumerAuthenticationInformationDTO'
        id:
          type: string
        paymentInformation:
          $ref: '#/components/schemas/PaymentInformationResponseDTO'
        riskInformation:
          $ref: '#/components/schemas/RiskInformationResponseDTO'
        status:
          type: string
        submitTimeUtc:
          type: string
    Dragonpay:
      type: object
      required:
      - redirection_parameters
      properties:
        proc_id:
          type: string
          description: Preferred payment channel
          enum:
          - BAYD
          - BDO
          - CC
          - CEBL
          - DPAY
          - ECPY
          - GCSH
          - LBC
          - PYPL
          - MLH
          - RDS
          - SMR
          - '711'
        param1:
          type: string
          description: Value that will be posted back to merchant postback/return url when completed
        param2:
          type: string
          description: Value that will be posted back to merchant postback/return url when completed
        mode:
          type: string
          description: '1: Online Banking,

            2: Over-the-Counter Banking and ATM,

            4: Over-the-Counter non-Bank,

            8: E-Wallets (inc. Bitcoins),

            16: (reserved internally),

            32: PayPal,

            64: Credit Cards,

            128: Mobile (Gcash),

            256: International OTC,

            512: Bancnet,

            1024: Auto Debit Arrangement (ADA),

            2048: Cash on Delivery (COD),

            4096: Installments.

            Mode of payment processing.'
          enum:
          - '1'
          - '2'
          - '4'
          - '8'
          - '16'
          - '32'
          - '64'
          - '128'
          - '256'
          - '512'
          - '1024'
          - '2048'
          - '4096'
        redirection_parameters:
          $ref: '#/components/schemas/RedirectionParametersDTO'
    FailureResponseDTO:
      type: object
      properties:
        _id:
          type: string
          description: This is the unique transaction id generated by Apexx.
        organisation_id:
          type: string
          description: The ID of an organisation.
        code:
          type: string
          description: An alphanumeric code which uniquely identify an error.
        status:
          type: string
          description: It will indicate what is the final result of the request.
        message:
          type: string
          description: A description of the response.
        timestamp:
          type: integer
          format: int64
          description: Current timestamp.
        details:
          type: string
          description: Optional details concerning the error.
        errors:
          type: array
          description: Details of each error occured.
          items:
            $ref: '#/components/schemas/Errors'
        trace_id:
          type: string
          description: Unique trace id created by APEXX platform to trace this request.
        merchant_reference:
          type: string
          description: A reference specified by the merchant to identify the transaction. Please ensure the reference is unique per transaction.
    AfterPayRequestDTO:
      type: object
      required:
      - afterpay
      - capture_now
      - merchant_reference
      properties:
        account:
          type: string
          description: The ID of the account. Acts as an override. Must be submitted if organisation and currency are not used in the request.
        organisation:
          type: string
          description: The ID of an organisation. Must be submitted along with currency if account is not used in the request.
        currency:
          type: string
