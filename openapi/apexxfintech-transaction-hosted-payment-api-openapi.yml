        passenger_title:
          type: string
          description: Title of the passenger
        passenger_name:
          type: string
          description: "Name of passenger.\n <b>Note:</b> Only alphabetic characters, Special characters allowed are (hyphen(-), underscore(_), dot(.), comma(,) and apostrophe(‘))."
        passenger_age_group:
          type: string
