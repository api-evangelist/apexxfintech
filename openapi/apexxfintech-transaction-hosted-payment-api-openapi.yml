openapi: 3.2.0
info:
  description: '# Using the API


    ## Authentication

    Authentication is managed using an API key, which is provided to you.'
  version: '2.0'
  title: APEXX FINTECH Transaction Hosted Payment API
  license:
    name: Apexx Fintech Ltd
    url: https://www.apexxfintech.com/legal-documentation/
servers:
- url: https://sandbox.apexx.global/atomic/v1/
tags:
- name: Transaction Hosted Payment
paths:
  '/api/payment/hosted ':
    post:
      tags:
      - Transaction Hosted Payment
      summary: Hosted Payment Request
      description: Create a new transaction using hosted payment page.
      operationId: hostedPayUsingPOST
      parameters:
      - name: X-APIKEY
        in: header
        description: X-APIKEY
        required: true
        schema:
          type: string
      responses:
        '200':
          description: JSON representation of the related transaction
          content:
            '*/*':
              schema:
                $ref: '#/components/schemas/HostedPayResponseRedocDTO'
        '400':
          description: "Bad / Invalid request\t"
          content:
            '*/*':
              schema:
                $ref: '#/components/schemas/HostedPreTxnErrorResponseDTO'
        '401':
          description: Unauthenticated user / missing API Key
          content:
            '*/*':
              schema:
                $ref: '#/components/schemas/HostedPreTxnErrorResponseDTO'
        '403':
          description: Forbidden error
          content:
            '*/*':
              schema:
                $ref: '#/components/schemas/FailureResponseDTO'
        '500':
          description: Internal Server Error / Unexpected Error
          content:
            '*/*':
              schema:
                $ref: '#/components/schemas/HostedPreTxnErrorResponseDTO'
        '503':
          description: Service Unavailable
          content:
            '*/*':
              schema:
                $ref: '#/components/schemas/FailureResponseDTO'
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/HostedPayRequestRedocDTO'
        description: ' '
  '/api/payment/hosted  ':
    post:
      tags:
      - Transaction Hosted Payment
      summary: Hosted DirectDebit Request
      description: This is a Hosted Payment Request. This provides a single interface for Hosted APM and Card Payment. In both card and APM scenario a check out URL gets generated. In case of Direct Debit, bank page gets displayed on redirection where user has to select Bank details and on click of continue button to create mandate.
      operationId: hostedPayDirectDebitUsingPOST
      parameters:
      - name: X-APIKEY
        in: header
        description: X-APIKEY
        required: true
        schema:
          type: string
      responses:
        '201':
          description: JSON representation of the related transaction
          content:
            '*/*':
              schema:
                $ref: '#/components/schemas/CommonResponseDTO'
        '400':
          description: "Bad / Invalid request\t"
          content:
            '*/*':
              schema:
                $ref: '#/components/schemas/CreateMandateFailureResponse'
        '401':
          description: Unauthenticated user / missing API Key
          content:
            '*/*':
              schema:
                $ref: '#/components/schemas/FailureResponseDTO'
        '403':
          description: Forbidden error
          content:
            '*/*':
              schema:
                $ref: '#/components/schemas/FailureResponseDTO'
        '412':
          description: Processing Errors
          content:
            '*/*':
              schema:
                $ref: '#/components/schemas/CreateMandateResponse'
        '500':
          description: Internal Server Error / Unexpected Error
          content:
            '*/*':
              schema:
                $ref: '#/components/schemas/FailureResponseDTO'
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateMandateRequest'
        description: ' '
  '/api/payment/hosted      ':
    post:
      tags:
      - Transaction Hosted Payment
      summary: Hosted Open Banking Request
      description: This is an Open Banking Hosted Payment Request. The response will include a checkout URL. The customer will be able to complete the payment after being sent to the checkout URL.
      operationId: hostedPayOpenBankingUsingPOST
      parameters:
      - name: X-APIKEY
        in: header
        description: X-APIKEY
        required: true
        schema:
          type: string
      responses:
        '201':
          description: JSON representation of the related transaction
          content:
            '*/*':
              schema:
                $ref: '#/components/schemas/OpenBankingCommonResponseDTO'
        '400':
          description: "Bad / Invalid request\t"
          content:
            '*/*':
              schema:
                $ref: '#/components/schemas/OpenBankingFailureResponse'
        '401':
          description: Unauthenticated user / missing API Key
          content:
            '*/*':
              schema:
                $ref: '#/components/schemas/FailedResponseDTO'
        '403':
          description: Forbidden error
          content:
            '*/*':
              schema:
                $ref: '#/components/schemas/FailedResponseDTO'
        '412':
          description: Processing Errors
          content:
            '*/*':
              schema:
                $ref: '#/components/schemas/OpenBankingDepositResponseDTO'
        '500':
          description: Internal Server Error / Unexpected Error
          content:
            '*/*':
              schema:
                $ref: '#/components/schemas/FailedResponseDTO'
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/OpenBankingDepositRequest'
        description: ' '
  /api/payment/hosted/select:
    post:
      tags:
      - Transaction Hosted Payment
      summary: Payment Selector Request
      description: Create a new transaction using payment selector to provide multiple options of payments to your customer.
      operationId: hostedPaymentSelectUsingPOST
      parameters:
      - name: X-APIKEY
        in: header
        description: X-APIKEY
        required: true
        schema:
          type: string
      responses:
        '200':
          description: JSON representation of the related transaction
          content:
            '*/*':
              schema:
                $ref: '#/components/schemas/HostedPayResponseRedocDTO'
        '400':
          description: "Bad / Invalid request\t"
          content:
            '*/*':
              schema:
                $ref: '#/components/schemas/HostedPreTxnErrorResponseDTO'
        '401':
          description: Unauthenticated user / missing API Key
          content:
            '*/*':
              schema:
                $ref: '#/components/schemas/HostedPreTxnErrorResponseDTO'
        '403':
          description: Forbidden error
          content:
            '*/*':
              schema:
                $ref: '#/components/schemas/FailureResponseDTO'
        '500':
          description: Internal Server Error / Unexpected Error
          content:
            '*/*':
              schema:
                $ref: '#/components/schemas/HostedPreTxnErrorResponseDTO'
        '503':
          description: Service Unavailable
          content:
            '*/*':
              schema:
                $ref: '#/components/schemas/FailureResponseDTO'
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PaymentSelectorRequestRedocDTO'
        description: ' '
components:
  schemas:
    PaymentSelectorCard:
      type: object
      properties:
        create_token:
          type: string
          description: Whether to create a token or not for the card. Defaults to 'false'. Setting it to 'true' will create the token for the card.
        three_ds:
          $ref: '#/components/schemas/PaymentSelectorThreeDs'
    OpenBankingDepositResponseDTO:
      type: object
      required:
      - _id
      - amount
      - merchant_reference
      - reason_code
      - status
      properties:
        _id:
          type: string
          description: This is the unique transaction id generated by Apexx.
        reason_code:
          type: string
          description: A reason code assigned by the acquiring platform; '0' in case of Success, see reason codes section for declined scenarios and error codes section for failed scenarios.
        reason_message:
          type: string
          description: A reason message assigned by the acquiring platform. Reason message will return if reason_code is not 0.
        status:
          type: string
          description: FAILED
        merchant_reference:
          type: string
          description: A reference specified by the merchant to identify the transaction. Please ensure the reference is unique per transaction.
        amount:
          type: number
          description: Amount received in the request.
        psp_transaction_reference:
          type: string
          description: This is the unique reference provided by Trustly.
        mandate_id:
          type: number
          description: This is the unique mandate id generated by Apexx which is used for all downstream operations.
    volt:
      type: object
      properties:
        type:
          type: string
          description: If volt object is sent then this field is mandatory otherwise optional
          enum:
          - BILL
          - GOODS
          - PERSON_TO_PERSON
          - OTHER
          - SERVICES
    PS_Agency:
      type: object
      properties:
        agency_code:
          type: string
          description: Travel agency code
        agency_name:
          type: string
          description: Travel agency name
        agency_address:
          type: string
          description: 'Street address of the card holder. Note: All characters support'
        agency_city:
          type: string
          description: 'City of the card holder Note: Only alphabetic characters, Special characters allowed are (hyphen(-), underscore(_), dot(.), comma(,))'
        agency_state:
          type: string
          description: 'A region / state / province for the address. Note: Only alphabetic characters, Special characters allowed are (hyphen(-), underscore(_), dot(.), comma(,))'
        agency_postal_code:
          type: string
          description: 'A postal code for the address. Note: Only alpha-numeric characters'
        agency_country:
          type: string
          description: 'A 2-letter ISO3166 alpha-2. country code for the address. Note: Alphabets upto two characters (e.g. GB, RU etc..)'
    PaypalSTC:
      type: object
      properties:
        key:
          type: string
          description: The key for the pair
        value:
          type: string
          description: The value for the pair
    BNPL:
      type: object
      properties:
        net_amount:
          type: integer
          format: int32
          description: Total net amount of order charged without a decimal place.
        payment_type:
          type: string
          description: Specifies the repayment plan type for providers which offer multiple options.
          enum:
          - installment
          - invoice
          - Direct Debit
        payment_type_data:
          type: array
          items:
            $ref: '#/components/schemas/PaymentTypeData'
    CreateMandateRequest:
      type: object
      required:
      - amount
      - currency
      - customer
      - direct_debit
      - merchant_reference
      - organisation
      properties:
        account:
          type: string
          description: The ID of the account. Acts as an override. Must be submitted if organisation and currency are not used in the request.
        organisation:
          type: string
          description: The ID of the Organisation. Must be submitted along with currency.
        capture_now:
          type: string
          description: This value is not used for direct debit and will always be defaulted to 'false'.
        customer_ip:
          type: string
          description: The IP address of the customer
        amount:
          type: integer
          format: int32
          description: Total gross amount of order charged without a decimal place e.g. $1.50 = 150. Currencies can have different decimals/exponentials, see Currencies Section for more details.. Must match the total of all order items"
        currency:
          type: string
          description: Currency using which transaction needs to be processed.  A 3-letter ISO 4217 currency code, see Currencies Section for more details.
        locale:
          type: string
          description: 'Locale Code. Valid Values: en_GB and en_US'
        user_agent:
          type: string
          description: The full user agent string of the device the customer used to submit the transaction
        dynamic_descriptor:
          type: string
          description: A short reference/descriptor that will show against the customers order
        merchant_reference:
          type: string
          description: 'A reference specified by the merchant to identify the transaction. Please ensure the reference is unique per transaction and  is limited to 10 alphanumeric characters. '
        webhook_transaction_update:
          type: string
          description: 'A webhook url that is called when a transaction is updated. Note: This overrides any URL set on the account'
        shopper_interaction:
          type: string
          description: Determines the point of sale of a customer.
          enum:
          - ecommerce
          - pos
          - moto
          - unknown
        direct_debit:
          description: Direct Debit payment schedule details
          $ref: '#/components/schemas/DD_DirectDebit'
        customer:
          description: Customer details
          $ref: '#/components/schemas/DD_Customer'
        duplicate_check:
          type: string
          description: This indicates the system whether to perform duplicate check on the transaction or not. A request is considered duplicate if the merchant_reference has already been used within last 24 hours.
    ShowCustomLabels:
      type: object
      properties:
        expiry_date:
          type: string
          description: 'Information which we will display for an expiry month and expiry year.


            Max-Length: 50 chars'
        cvv:
          type: string
          description: 'Information which we will display for the cvv.


            Max-Length: 50 chars'
    PlaceHolderRedocDTO:
      type: object
      properties:
        card_number:
          type: string
          description: This fields allows to provide a customized placeholder name for card number field
        cvv:
          type: string
          description: This fields allows to provide a customized placeholder name for cvv field
        expiry_month:
          type: string
          description: This fields allows to provide a customized placeholder name for expiry month field
        expiry_year:
          type: string
          description: This fields allows to provide a customized placeholder name for expiry year field
        expiry_date:
          type: string
          description: This fields allows to provide a customized placeholder name for expiry date field
        card_holder_name:
          type: string
          description: This fields allows to provide a customized placeholder name for car holder name field
        address:
          description: This fields allows to provide a customized placeholder name for address block address field
          $ref: '#/components/schemas/AddressPlaceHolderRedocDTO'
    PS_Data:
      type: object
      properties:
        key_name:
          type: string
          description: The name of the key for the key value pair. e.g. "meal type", "Extra Towels"
        value:
          type: string
          description: The value for the key value pair. e.g. "vegitarian"
    AccountHistoryDTO:
      type: object
      properties:
        first_use_of_shipping_address:
          type: string
          description: Applicable when this is not a guest account.
        shipping_address_usage_date:
          type: string
          description: Date when the shipping address for this transaction was first used. Recommended for Discover ProtectBuy. If firstUseOfShippingAddress is false and not a guest account, then this date is entered.
    subscription:
      type: object
      properties:
        payment_schedule:
          type: array
          description: List of payment schedule
          items:
            $ref: '#/components/schemas/SubscriptionPaymentScheduleDTO'
        payment_settlement_date:
          type: string
          description: Future date by which settlement request should be done. If this is too early in time, it will be postponed to the earliest payment Date.
    openBankingDeliveryAddress:
      type: object
      properties:
        address:
          type: string
          description: Street address of the card holder.
        city:
          type: string
          description: City of the card holder.
        country:
          type: string
          description: "A 2-letter ISO3166 alpha-2. country code for the address. \n\nNote: Alphabets upto two characters (e.g. GB, RU etc..)"
        email:
          type: string
          description: 'Email address of the card holder.


            Note: Only alphabets, numeric, @, comma(,) dot(.), plus(+), underscore(_), dash(-) and apostrophe(â€˜)'
        phone:
          type: string
          description: 'Numbers only, no dash or any other separator.


            Note: Length - min(3) & max(20)'
        postal_code:
          type: string
          description: A postal code for the address.
        state:
          type: string
          description: A region / state / province for the address.
    PaymentTypeData:
      type: object
      properties:
        key_name:
          type: string
          description: The name of the key for the key value pair
        value:
          type: string
          description: The value for the key value pair
      description: provider specific key values pairs, should be an array of the 'key_name' value and the 'value' value - Please speak to your Implementation manager for details on usage.
    AddressLabelRedocDTO:
      type: object
      properties:
        first_name:
          type: string
          description: This fields allows to provide a customized label name for address block first name field
        last_name:
          type: string
          description: This fields allows to provide a customized label name for address block last name field
        email:
          type: string
          description: This fields allows to provide a customized label name for address block email field
        address:
          type: string
          description: This fields allows to provide a customized label name for address block address field
        city:
          type: string
          description: This fields allows to provide a customized label name for address block city field
        state:
          type: string
          description: This fields allows to provide a customized label name for address block state field
        postal_code:
          type: string
          description: This fields allows to provide a customized label name for address block postal code field
        country:
          type: string
          description: This fields allows to provide a customized label name for address block country field
        phone:
          type: string
          description: This fields allows to provide a customized label name for address block phone field
    AuthorisePaymentCustomer:
      type: object
      properties:
        account_number:
          type: string
          description: This is the recipient's account number.
        customer_id:
          type: string
          description: The customer_id of recipient's.
        date_of_birth:
          type: string
          description: The date of birth of a customer, 10 characters, ISO-8601 (YYYY-MM-DD).
        last_name:
          type: string
          description: Last name of the customer.
        postal_code:
          type: string
          description: 'This is the recipient''s postcode/zip.


            Note: Only alpha-numeric characters, Special characters allowed are hyphen(-) and single space'
    DD_PaymentSchedule:
      type: object
      properties:
        date:
          type: string
          description: Scheduled payment date.
        order:
          type: integer
          format: int32
          description: The ordinal position of the scheduled payment.
        schedule_amount:
          type: integer
          format: int32
          description: The expected amount to be debited.
    ProfileDataDTO:
      type: object
      properties:
        name:
          type: string
          description: Name of the active profile chosen by the profile selector. If no profile selector exists, the default active profile is chosen.
    RiskInformationDTO:
      type: object
      properties:
        profile:
          description: Identifies a risk profile.
          $ref: '#/components/schemas/ProfileDataDTO'
        event_type:
          type: string
          description: 'Specifies one of the following types of events:


            1. login


            2. account_creation


            3. account_update For regular payment transactions, do not send this field.'
        buyer_history:
          description: buyerHistory
          $ref: '#/components/schemas/BuyerHistoryDTO'
    hpp_threeds:
      type: object
      properties:
        three_ds_required:
          type: string
          description: "Valid values: \"true\"\t\"false\"\t\n\ntrue if 3DS required for this transaction, false otherwise."
        three_ds_version:
          type: string
          description: "Valid values: \"1.0\"\t\"2.0\"\t\n\nThe 3-D Secure version used for the authentication"
    PS_Insurance:
      type: object
      properties:
        agency_name:
          type: string
          description: Name of insurer
        type:
          type: string
          description: Type of insurance
          enum:
          - cancellation
          - travel
          - cancellation_travel
          - car
          - bankruptcy
        amount:
          type: integer
          format: int32
          description: Amount of order charged without a decimal place e.g. $1.50 = 150
    ExternalRiskData:
      type: object
      properties:
        session_id:
          type: string
          description: Session ID of the transaction. This session id can be used to obtain device fingerprint information. You can use any id that you are already generating, such as an order number or web session ID.
        provider:
          type: string
          description: Third party provider for the risk check.
          enum:
          - CYBERSOURCE
        cs_dm:
          description: CybersourceDecisionManagerRequest
          $ref: '#/components/schemas/CybersourceDecisionManagerRequest'
    DD_DirectDebit:
      type: object
      required:
      - landing_page
      - redirect_urls
      properties:
        payment_schedule:
          type: array
          description: List of payment schedule
          items:
            $ref: '#/components/schemas/DD_PaymentSchedule'
        landing_page:
          type: string
          description: This value will determine where the user will land when they are redirected to the mandate creation page. 'Bank' directs the users to a list of banks. 'manual' directs the customer to select to enter details manually.
          enum:
          - bank
          - manual
        redirect_urls:
          description: Redirection URL details
          $ref: '#/components/schemas/DD_RedirectUrls'
    Address:
      type: object
      properties:
        email:
          type: string
          description: 'Email address of the card holder.


            Note: Only alphabets, numeric, @, comma(,) dot(.), plus(+), underscore(_), dash(-) and apostrophe(â€˜)'
        phone:
          type: string
          description: 'Numbers only, no dash or any other separator.


            Note: Length - min(3) & max(20)'
        address:
          type: string
          description: Street address of the delivery customer.
        city:
          type: string
          description: City of the delivery customer
        state:
          type: string
          description: A region / state / province for the address.
        postal_code:
          type: string
          description: 'This is the recipient''s postcode/zip.


            Note: Only alpha-numeric characters, Special characters allowed are hyphen(-) and single space'
        country:
          type: string
          description: "A 2-letter ISO3166 alpha-2. country code for the address. \n\nNote: Alphabets upto two characters (e.g. GB, RU etc..)"
    LabelsRedocDTO:
      type: object
      properties:
        card_number:
          type: string
          description: This fields allows to provide a customized label name for card number field
        cvv:
          type: string
          description: This fields allows to provide a customized label name for cvv field
        expiry_month:
          type: string
          description: This fields allows to provide a customized label name for expiry month field
        expiry_year:
          type: string
          description: This fields allows to provide a customized label name for expiry year field
        expiry_date:
          type: string
          description: This fields allows to provide a customized label name for expiry date field
        card_holder_name:
          type: string
          description: This fields allows to provide a customized label name for car holder name field
        address:
          description: This fields allows to provide a customized label name for address block fields
          $ref: '#/components/schemas/AddressLabelRedocDTO'
    DD_RedirectUrls:
      type: object
      required:
      - cancelled
      - failed
      - success
      properties:
        success:
          type: string
          description: The return url to which the customer is redirected after an transaction is processed.
        failed:
          type: string
          description: The return url to which the customer is redirected after an transaction is unsuccessful.
        cancelled:
          type: string
          description: The return url to which the customer is redirected after failing to complete provider registration and payment confirmation steps.
    DeviceInformationDTO:
      type: object
      properties:
        cookies_accepted:
          type: string
          description: Whether the customer’s browser accepts cookies.
          enum:
          - 'True'
          - 'False'
        host_name:
          type: string
          description: DNS resolved hostname from ipAddress.
        http_browser_email:
          type: string
          description: Email address set in the customer’s browser, which may differ from customer email
        http_accept_browser_value:
          type: string
          description: Value of the Accept header sent by the customer’s web browser. Note If the customer’s browser provides a value, you must include it in your request.
        http_accept_content:
          type: string
          description: The exact content of the HTTP accept header.
        http_accept_language:
          type: string
          description: Value represents the browser language as defined in IETF BCP47. Example:en-US
        http_java_enabled:
          type: string
          description: A Boolean value that represents the ability of the cardholder browser to execute Java. Value is returned from the navigator.javaEnabled property.
          enum:
          - 'True'
          - 'False'
        http_java_script_enabled:
          type: string
          description: 'A Boolean value that represents the ability of the cardholder browser to execute JavaScript. Note: Merchants should be able to know the values from fingerprint details of cardholder''s browser.'
          enum:
          - 'True'
          - 'False'
        http_color_depth:
          type: string
          description: 'Value represents the bit depth of the color palette for displaying images, in bits per pixel. Example : 24'
        http_screen_height:
          type: string
          description: 'Total height of the Cardholder''s scree in pixels. Example: 864.'
        http_screen_width:
          type: string
          description: 'Total width of the cardholder''s screen in pixels. Example: 1536.'
        http_time_difference:
          type: string
          description: Time difference between UTC time and the cardholder browser local time, in minutes. Example:300
        user_agent_browser_value:
          type: string
          description: Value of the User-Agent header sent by the customer’s web browser. Note If the customer’s browser provides a value, you must include it in your request.
    Point:
      type: object
      properties:
        type:
          type: string
          description: The type or category of points
        scheme:
          type: string
          description: Name of points scheme provider
        used:
          type: integer
          format: int32
          description: Points used this transaction
        balance:
          type: integer
          format: int32
          description: Remaining points balance
    PaymentSelectorOpenBanking:
      type: object
      required:
      - payment_method
      properties:
        payment_method:
          type: string
          description: Payment processor to process the payment
          enum:
          - trustly
          - volt
          - trustly_subscription
        volt:
          description: Type of the transaction
          $ref: '#/components/schemas/volt'
        subscription:
          description: Payment schedule
          $ref: '#/components/schemas/subscription'
    PaymentSelectorDirectDebit:
      type: object
      required:
      - landing_page
      properties:
        payment_schedule:
          type: array
          description: List of payment schedule
          items:
            $ref: '#/components/schemas/PaymentSchedule'
        landing_page:
          type: string
          description: This value will determine where the user will land when they are redirected to the mandate creation page. 'Bank' directs the users to a list of banks. 'manual' directs the customer to select to enter details manually.
          enum:
          - bank
          - manual
    Errors:
      type: object
      properties:
        error_code:
          type: integer
          format: int32
          description: Error Code
        property:
          type: string
          description: 'Property on which error occurs. e.g : it can be class name , field name'
        error_message:
          type: string
          description: Error message
    OpenBankingDepositRequest:
      type: object
      required:
      - amount
      - billing_address
