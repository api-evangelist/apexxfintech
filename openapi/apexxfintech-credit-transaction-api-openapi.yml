openapi: 3.2.0
info:
  description: '# Using the API


    ## Authentication

    Authentication is managed using an API key, which is provided to you.'
  version: '2.0'
  title: APEXX FINTECH Credit Transaction API
  license:
    name: Apexx Fintech Ltd
    url: https://www.apexxfintech.com/legal-documentation/
servers:
- url: https://sandbox.apexx.global/atomic/v1/
tags:
- name: Credit Transaction
paths:
  /api/creditTransaction:
    post:
      tags:
      - Credit Transaction
      summary: Create a new Credit transaction
      operationId: createCreditTransactionUsingPOST
      parameters:
      - name: X-APIKEY
        in: header
        description: X-APIKEY
        required: true
        schema:
          type: string
      responses:
        '200':
          description: JSON representation of the related transaction
          content:
            '*/*':
              schema:
                $ref: '#/components/schemas/CreditTransactionResponseDTO'
        '400':
          description: "Bad / Invalid request\t"
          content:
            '*/*':
              schema:
                $ref: '#/components/schemas/FailureResponseDTO'
        '401':
          description: Unauthenticated user / missing API Key
          content:
            '*/*':
              schema:
                $ref: '#/components/schemas/FailureResponseDTO'
        '403':
          description: Forbidden error
          content:
            '*/*':
              schema:
                $ref: '#/components/schemas/FailureResponseDTO'
        '412':
          description: Processing Errors
          content:
            '*/*':
              schema:
                $ref: '#/components/schemas/CreditProcessingErrorResponseDTO'
        '500':
          description: Internal Server Error / Unexpected Error
          content:
            '*/*':
              schema:
                $ref: '#/components/schemas/FailureResponseDTO'
        '503':
          description: Service Unavailable
          content:
            '*/*':
              schema:
                $ref: '#/components/schemas/FailureResponseDTO'
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreditTransactionDTO'
        description: ' '
  /api/creditTransaction/cancel/{transactionId}:
    put:
      tags:
      - Credit Transaction
      summary: Voids the created credit transactions
      operationId: cancelCreditTransactionUsingPUT
      parameters:
      - name: transactionId
        in: path
        description: The ID of the transaction
        required: true
        schema:
          type: string
      responses:
        '200':
          description: JSON representation of the related transaction
          content:
            '*/*':
              schema:
                $ref: '#/components/schemas/CancelCreditTransactionResponse'
        '400':
          description: "Bad / Invalid request\t"
          content:
            '*/*':
              schema:
                $ref: '#/components/schemas/FailureResponseDTO'
        '401':
          description: Unauthenticated user / missing API Key
          content:
            '*/*':
              schema:
                $ref: '#/components/schemas/FailureResponseDTO'
        '403':
          description: Forbidden error
          content:
            '*/*':
              schema:
                $ref: '#/components/schemas/FailureResponseDTO'
        '412':
          description: Processing Errors
          content:
            '*/*':
              schema:
                $ref: '#/components/schemas/CancelCreditFailureResponse'
        '500':
          description: Internal Server Error / Unexpected Error
          content:
            '*/*':
              schema:
                $ref: '#/components/schemas/FailureResponseDTO'
        '503':
          description: Service Unavailable
          content:
            '*/*':
              schema:
                $ref: '#/components/schemas/FailureResponseDTO'
components:
  schemas:
    BillingAddress:
      type: object
      properties:
        first_name:
          type: string
          description: First name of the card holder.
        last_name:
          type: string
          description: Last name of the card holder.
        email:
          type: string
          description: 'Email address of the card holder.


            Note: Only alphabets, numeric, @, comma(,) dot(.), plus(+), underscore(_), dash(-) and apostrophe(â€˜)'
        address:
          type: string
          description: Street address of the card holder.
        city:
          type: string
          description: City of the card holder.
        state:
          type: string
          description: A region / state / province for the address.
        postal_code:
          type: string
          description: 'A postal code for the address.


            Note: Only alpha-numeric characters, Special characters allowed are hyphen(-) and spaces.'
        country:
          type: string
          description: "A 2-letter ISO3166 alpha-2. country code for the address. \n\nNote: Alphabets upto two characters (e.g. GB, RU etc..)"
        phone:
          type: string
          description: 'Numbers only, no dash or any other separator.


            Note: Length - min(3) & max(20)'
    RuleDTO:
      type: object
      properties:
        decision:
          type: string
        name:
          type: string
    FailureResponseDTO:
      type: object
      properties:
        _id:
          type: string
          description: This is the unique transaction id generated by Apexx.
        organisation_id:
          type: string
          description: The ID of an organisation.
        code:
          type: string
          description: An alphanumeric code which uniquely identify an error.
        status:
          type: string
          description: It will indicate what is the final result of the request.
        message:
          type: string
          description: A description of the response.
        timestamp:
          type: integer
          format: int64
          description: Current timestamp.
        details:
          type: string
          description: Optional details concerning the error.
        errors:
          type: array
          description: Details of each error occured.
          items:
            $ref: '#/components/schemas/Errors'
        trace_id:
          type: string
          description: Unique trace id created by APEXX platform to trace this request.
        merchant_reference:
          type: string
          description: A reference specified by the merchant to identify the transaction. Please ensure the reference is unique per transaction.
    CybersourceDecisionManagerResponse:
      type: object
      properties:
        clientReferenceInformation:
          $ref: '#/components/schemas/ClientReferenceInformationDTO'
        consumerAuthenticationInformation:
          $ref: '#/components/schemas/ConsumerAuthenticationInformationDTO'
        id:
          type: string
        paymentInformation:
          $ref: '#/components/schemas/PaymentInformationResponseDTO'
        riskInformation:
          $ref: '#/components/schemas/RiskInformationResponseDTO'
        status:
          type: string
        submitTimeUtc:
          type: string
    PspInformation:
      type: object
      properties:
        routing_sequence_id:
          type: integer
          format: int32
        psp_id:
          type: string
          description: The ID of the payment service provider.
        psp_name:
          type: string
          description: The name of the payment service provider as setup within the APEXX payment gateway.
        apexx_name:
          type: string
          description: Name of the psp as setup within the APEXX payment gateway.
        acquirer_name:
          type: string
          description: The name of the acquirer as setup within the APEXX payment gateway.
        cascading_acquirer:
          type: string
          description: The name of the acquirer which declined/authorised the cascaded transaction.
        organisation_psp_name:
          type: string
          description: The name of the processor as setup within the APEXX payment gateway. i.e. Merchant Name - Acquirer Name.
        transport_method:
          type: string
        start_time_stamp:
          type: string
        end_time_stamp:
          type: string
        ellapsed_time:
          type: string
        status:
          type: string
          description: The status of the transaction as provided by the psp.
        sub_status:
          type: string
        time_out:
          type: integer
          format: int32
        response_code:
          type: string
          description: The response code received from the payment service provider for the transaction.
        response_message:
          type: string
          description: The response message received from the payment service provider for the transaction.
        errors:
          type: array
          items:
            $ref: '#/components/schemas/PspErrorDTO'
        mid_country:
          type: string
          description: The country setup for the “mid” used to process the transaction as setup within the APEXX payment gateway.
        psp_transaction_reference:
          type: string
          description: The unique id provided by the payment service provider for the transaction.
        category_code:
          type: string
        category_message:
          type: string
        reconciliation_id:
          type: string
          description: Reference number for the transaction generated by the PSP or Acquirer to provide end to end traceability for reconciliation purposes. Only supported by some PSP or Acquirers. Please speak to your implementation number to understand more.
    deviceInformation:
      type: object
      properties:
        http_color_depth:
          type: string
          description: Represents the bit depth of color supported by the user’s display environment. It indicates how many bits are used to represent the color of a single pixel, which in turn defines the range of distinct colors that can be displayed.
        http_java_enabled:
          type: string
          description: Indicates whether the customer’s browser supports and has Java enabled (true / false).This helps assess the browser environment and can be used in device fingerprinting or fraud risk checks.
        http_java_script_enabled:
          type: string
          description: Indicates whether the customer’s browser has JavaScript enabled (true / false).Helps determine if the environment supports interactive web features and can be used for fraud/risk evaluation.
        http_browser_language:
          type: string
          description: The default language setting of the customer’s browser (e.g., "en-US", "fr-FR").Useful for localization, risk analysis, and understanding customer preferences.
        http_screen_height:
          type: string
          description: The height of the customer’s device screen in pixels (e.g., 1080).Often captured to verify the device profile.
        http_screen_width:
          type: string
          description: The width of the customer’s device screen in pixels (e.g., 1920).Used together with http_screen_height to describe display resolution.
        http_time_difference:
          type: string
          description: The time zone offset (in minutes or hours) between the customer’s local device time and UTC (e.g., +330 for IST).Helps in detecting anomalies if device time doesn’t match geolocation.
        customer_ip:
          type: string
          description: The IP address of the customer’s device at the time of transaction (IPv4 or IPv6).Commonly used for geolocation and fraud detection.
        http_accept_browser_value:
          type: string
          description: 'The raw Accept header value sent by the browser


            (e.g."text/html","application/xhtml+ xml","application/xml";"q=0.9")


            Identifies the content types the browser supports.'
        user_agent_browser_value:
          type: string
          description: The raw User-Agent header string provided by the browser (e.g., Mozilla/5.0 (Windows NT 10.0; Win64; x64)).Contains information about browser,OS,and device.
        device_channel:
          type: string
          description: Specifies the channel through which the transaction is initiated (e.g., "BROWSER", "APP", "POS").<br>Helps in categorizing the origin of the request.For HPP and for javascript based transactions value should be BROWSER.
    CustomerDetails:
      type: object
      properties:
        account_number:
          type: string
          description: This is the recipient's account number.
        date_of_birth:
          type: string
          description: The date of birth of a customer, 10 characters, ISO-8601 (YYYY-MM-DD).
        last_name:
          type: string
          description: The last name(s) of recipient's.
        postal_code:
          type: string
          description: 'This is the recipient''s postcode/zip.


            Note: Only alpha-numeric characters, Special characters allowed are hyphen(-) and single space'
        customer_id:
          type: string
          description: The customer_id of recipient's.
        name:
          type: string
          description: Full name of the customer or organisation
        iban:
          type: string
          description: International bank account number of the customer. Required for SEPA open banking
        swift_bic:
          type: string
          description: Swift/BIC of the customer bank
        sort_code:
          type: string
          description: Sort code of the customer bank. Required for UK/domestic
    CreditTransactionResponseDTO:
      type: object
      required:
      - amount
      - card
      - merchant_reference
      properties:
        _id:
          type: string
          description: This is the unique id generated by Apexx.
        account:
          type: string
          description: The ID of the account. Acts as an override. Must be submitted if organisation and currency are not used in the request.
        organisation:
          type: string
          description: The ID of an organisation. Must be submitted along with currency if account is not used in the request.
        currency:
          type: string
          description: Currency using which transaction needs to be processed. Must be submitted if account is not used in the request. This field is ignored if submitted along with the account, Apexx uses the currency configured with the account to process the transaction when account is submitted. A 3-letter ISO 4217 currency code, see Currencies Section for more details.
        amount:
          type: string
          description: Amount is charged without a decimal place e.g. $1.50 = 150. Currencies can have different decimals/exponentials, see Currencies Section for more details.
        authorization_code:
          type: string
          description: An authorisation code assigned by the processing platform
        blocked:
          type: boolean
          example: false
          description: True if the transaction has been blocked by a ruleset, false otherwise
        dynamic_descriptor:
          type: string
          description: A short reference/descriptor that will show up on the customers bank statement. Only supported by some acquirers. Please confirm with your Implementation Manager for supported acquirers and formats.
        card:
          $ref: '#/components/schemas/CreditTransactionCard'
        merchant_reference:
          type: string
          description: A reference specified by the merchant to identify the transaction. Please ensure the reference is unique per transaction.
        customer_ip:
          type: string
          description: The IP address of the customer
        user_agent:
          type: string
          description: The full user agent string of the device the customer used to submit the transaction
        webhook_transaction_update:
          type: string
          description: 'A webhook url that is called when a transaction is updated. Note: This overrides any URL set on the account'
        actions:
          type: array
          items:
            type: string
        created_at:
          type: string
          description: The time at which the transaction was created
        cvv_present:
          type: boolean
          example: false
          description: True if the card was used with a cvv
        fees:
          type: array
          items:
            type: integer
            format: int32
        geo_locations:
          type: array
          description: The latitude/longitude resolved from the customer's ip address
          items:
            type: integer
            format: int32
        last_status_update:
          type: string
          description: The last time when the status of the transaction was updated
        card_brand:
          type: string
          description: Card brand for the card used for processing
          enum:
          - amex
          - diners
          - discover
          - elo
          - jcb
          - maestro
          - mastercard
          - visa
          - visa electron
          - carte bancaire
        issuer_name:
          type: string
          description: Card Issuer Name for this transaction
        issuer_country:
          type: string
          description: Issuing country of the card. A 2-letter ISO3166 alpha-2. Acquirer country code
        organisation_psp_name:
          type: string
          description: The name of the processor as setup within the APEXX payment gateway. i.e. Merchant Name - Acquirer Name
        reason_code:
          type: string
          description: A reason code assigned by the acquiring platform; '0' in case of AUTHORISED/CAPTURED, see **[reason codes](#section/Appendix)** section for declined scenarios and **[error codes](#section/Appendix)** section for failed scenarios.
        reason_message:
          type: string
          description: A reason message assigned by the acquiring platform. Reason message will return if reason_code is not 0
        billing_address:
          description: Billing address details for the customer
          $ref: '#/components/schemas/BillingAddress'
        payment product = "card":
          type: string
          description: The payment product corresponding to this transaction
        status:
          type: string
          description: Status of the transaction.
          enum:
          - AUTHORISED
          - CAPTURED
          - DECLINED
        shopper_interaction:
          type: string
          description: Determines the point of sale of a customer.
          enum:
          - ecommerce
          - pos
          - moto
          - unknown
        cvv_result:
          type: string
          description: CVV verification result, as returned by the processor.
        avs_result:
          type: string
          description: Address verification services result, as returned by the processor
        acquirer_name:
          type: string
          description: The name of the acquirer as setup within the APEXX payment gateway.
        device_information:
          description: deviceInformation
          $ref: '#/components/schemas/deviceInformation'
        preauth_check:
          $ref: '#/components/schemas/FraudCheckResponse'
        response_code:
          type: string
          description: Response code is sent only when the source of the response looks suspicious. In this case Apexx immediately cancels the transaction placed with the gateway.
        airline_data:
          description: airlineData
          $ref: '#/components/schemas/airlineData'
        payment_product_type:
          type: string
          description: The payment product type corresponding to this transaction
          enum:
          - Amex
          - Diners Club International
          - Discover
          - Elo
          - JCB
          - Maestro
          - Mastercard
          - Visa
          - Visa Electron
        response_message:
          type: string
          description: A description of the response_code.
        customer:
          description: customer
          $ref: '#/components/schemas/CustomerDetails'
        aft_type:
          type: string
          description: 'Type of Account Funding transaction.


            SVWF - Stored value wallet funding


            SDWT - Staged digital wallet pre-funding


            A2A - Account-to-account (me-to-me) money transfer


            P2P - Person-to-Person (P2P) money transfer


            CLA - Cryptocurrency and liquid assets


            BIT - Financial Institution offe red Bank-Initiated P2P Money Transfer


            FD - Funds Disbursement


            FT - Funds Transfer


            PD - Payroll Disbursement


            PL - Prepaid load / reload2


            B2B - Business to Business


            CBP - Card Bill Payment


            GP - Gambling Payouts


            GFD - General funds disbursement


            GD - Government Disbursement


            LP - Loyalty Payments


            MD - Funding small business disbursements


            MP - Merchant Payment


            NCBP - Non card bill payment


            OGP - Online gaming payout


            ZDA - Zero dollar authorisation


            TO - Top off'
          enum:
          - SVWF
          - SDWT
          - A2A
          - P2P
          - CLA
          - BIT
          - FD
          - FT
          - PD
          - TPL
          - B2BCBP
          - GP
          - GFD
          - GD
          - LP
          - MD
          - MP
          - NCBP
          - OGP
          - ZDA
          - TO
    RiskInformationResponseDTO:
      type: object
      properties:
        case_priority:
          type: string
        info_codes:
          $ref: '#/components/schemas/InfoCodesDTO'
        local_time:
          type: string
        profile_response:
          $ref: '#/components/schemas/ProfileDTO'
        providers:
          $ref: '#/components/schemas/ProvidersDTO'
        rules:
          type: array
          items:
            $ref: '#/components/schemas/RuleDTO'
        score:
          $ref: '#/components/schemas/ScoreDTO'
    PaysafeCreditTxnRedirectUrlsDTO:
      type: object
      properties:
        success:
          type: string
          description: The return url to which the customer is redirected after an transaction is processed.
        failed:
          type: string
          description: The return url to which the customer is redirected after an transaction is unsuccessful.
        cancelled:
          type: string
          description: The return url to which the customer is redirected after failing to complete provider registration and payment confirmation steps.
    MerchantData:
      type: object
      properties:
        brand_name:
          type: string
          description: Merchant Brand name
        custom_data:
          type: object
        website_url:
          type: string
          description: Merchant website.
    SkrillCredit:
      type: object
      properties:
        account_holder_name:
          type: string
          description: 'Name of the account holder.


            Note: Only numeric characters are not support'
        redirect_urls:
          $ref: '#/components/schemas/SkrillCreditTxnRedirectUrlsDTO'
    CreditTransactionDTO:
      type: object
      required:
      - amount
      - card
      - merchant_reference
      properties:
        account:
          type: string
          description: The ID of the account. Acts as an override. Must be submitted if organisation and currency are not used in the request.
        organisation:
          type: string
          description: The ID of an organisation. Must be submitted along with currency if account is not used in the request.
        currency:
          type: string
          description: Currency using which transaction needs to be processed. Must be submitted if account is not used in the request. This field is ignored if submitted along with the account, Apexx uses the currency configured with the account to process the transaction when account is submitted. A 3-letter ISO 4217 currency code, see Currencies Section for more details.
        amount:
          type: number
          description: Amount is charged without a decimal place e.g. $1.50 = 150. Currencies can have different decimals/exponentials, see Currencies Section for more details.
        dynamic_descriptor:
          type: string
          description: A short reference/descriptor that will show up on the customers bank statement. Only supported by some acquirers. Please confirm with your Implementation Manager for supported acquirers and formats.
        merchant_reference:
          type: string
          description: A reference specified by the merchant to identify the transaction. Please ensure the reference is unique per transaction.
        card:
          description: The new card number, also known as PAN.
          $ref: '#/components/schemas/CreditTransactionCard'
        customer:
          description: customer
          $ref: '#/components/schemas/CustomerDetails'
        customer_ip:
          type: string
          description: The IP address of the customer
        open_banking:
          description: Open Banking specific Object
          $ref: '#/components/schemas/OpenBankingCreditTxnDTO'
        skrill:
          $ref: '#/components/schemas/SkrillCredit'
        paysafecard:
          $ref: '#/components/schemas/PaysafeCredit'
        user_agent:
          type: string
          description: The full user agent string of the device the customer used to submit the transaction
        webhook_transaction_update:
          type: string
          description: 'A webhook url that is called when a transaction is updated. Note: This overrides any URL set on the account'
        billing_address:
          description: Billing address details for the customer
          $ref: '#/components/schemas/BillingAddress'
        shopper_interaction:
          type: string
          description: Determines the point of sale of a customer.
          enum:
          - ecommerce
          - pos
          - moto
          - unknown
        airline_data:
          description: airlineData
          $ref: '#/components/schemas/airlineData'
        original_transaction_id:
          type: string
          description: The id of original transaction.
        merchant_data:
          description: Merchant Data
          $ref: '#/components/schemas/MerchantData'
    CancelCreditTransactionResponse:
      type: object
      required:
      - amount
      - merchant_reference
      properties:
        _id:
          type: string
          description: This is the unique id generated by Apexx.
        account:
          type: string
          description: The ID of the account. Acts as an override. Must be submitted if organisation and currency are not used in the request.
        amount:
          type: number
          description: Amount is charged without a decimal place e.g. $1.50 = 150. Currencies can have different decimals/exponentials, see Currencies Section for more details.
        organisation:
          type: string
          description: The ID of an organisation. Must be submitted along with currency if account is not used in the request.
        currency:
          type: string
          description: Currency using which transaction needs to be processed. Must be submitted if account is not used in the request. This field is ignored if submitted along with the account, Apexx uses the currency configured with the account to process the transaction when account is submitted. A 3-letter ISO 4217 currency code, see Currencies Section for more details.
        authorization_code:
          type: string
          description: An authorisation code assigned by the processing platform
        dynamic_descriptor:
          type: string
          description: A short reference/descriptor that will show up on the customers bank statement. Only supported by some acquirers. Please confirm with your Implementation Manager for supported acquirers and formats.
        merchant_reference:
          type: string
          description: A reference specified by the merchant to identify the transaction. Please ensure the reference is unique per transaction.
        created_at:
          type: string
          description: The time at which the transaction was created
        cancelled_amount:
          type: number
          description: Total amount cancelled
        status:
          type: string
          description: Status of the transaction.
          enum:
          - CANCELLED
          - FAILED
          - DECLINED
        authorized_amount:
          type: number
          description: Total amount authorised
        psp_info:
          description: PSP Information.
          $ref: '#/components/schemas/PspInformation'
        last_status_update:
          type: string
          description: The last time when the status of the transaction was updated
        reason_code:
          type: string
          description: A reason code assigned by the acquiring platform; '0' in case of AUTHORISED/CAPTURED, see **[reason codes](#section/Appendix)** section for declined scenarios and **[error codes](#section/Appendix)** section for failed scenarios.
        reason_message:
          type: string
          description: A reason message assigned by the acquiring platform. Reason message will return if reason_code is not 0
        response_code:
          type: string
          description: Response code is sent only when the source of the response looks suspicious. In this case Apexx immediately cancels the transaction placed with the gateway.
        response_message:
          type: string
          description: A description of the response_code.
    InfoCodesDTO:
      type: object
      properties:
        address:
          type: array
          items:
            type: string
        customer_list:
          type: array
          items:
            type: string
        global_velocity:
          type: array
          items:
            type: string
        identity_change:
          type: array
          items:
            type: string
        internet:
          type: array
          items:
            type: string
        phone:
          type: array
          items:
            type: string
        suspicious:
          type: array
          items:
            type: string
        velocity:
          type: array
          items:
            type: string
    FlightDetails:
      type: object
      properties:
        carrier_code:
          type: string
          description: Travel carrier code
        flight_number:
          type: integer
          format: int32
          description: Flight number excluding carrier code.
        origin_airport:
          type: string
          description: Origin airport/city IATA code.
        origin_city:
          type: string
          description: Origin city name.
        service_class:
          type: string
          description: Ticket category/class (“0” if no class).
          enum:
          - economy
          - premium economy
          - business class
          - first class
          - '0'
        stop_over_code:
          type: string
          description: 'Stop over code -


            O (capital letter "O") or 0 (zero) : Stopover allowed


            X (capital letter "X") or 1 : Stopover not allowed'
          enum:
          - X
          - O
          - '1'
          - '0'
        departure_date:
          type: string
          description: Departure date. Format - YYYY-MM-DD HH:mm:ss
        destination_airport:
          type: string
          description: Destination airport/city IATA code.
        destination_city:
