          enum:
          - direct
          - redirect
        reason_code:
          type: string
          description: An authorisation code assigned by the processing platform.
        reason_message:
          type: string
          description: A reason message assigned by the acquiring platform. Reason message will return if reason_code is not 0
        _id:
          type: string
          description: This is the unique transaction id generated by Apexx.
        organisation:
          type: string
          description: The ID of the Organisation. Must be submitted along with currency.
        currency:
          type: string
          description: Currency using which transaction needs to be processed.  A 3-letter ISO 4217 currency code, see Currencies Section for more details.
        amount:
          type: integer
          format: int32
          description: Total gross amount of order charged without a decimal place e.g. $1.50 = 150. Currencies can have different decimals/exponentials, see Currencies Section for more details.. Must match the total of all order items
        net_amount:
          type: integer
          format: int32
          description: Total net amount of order charged without a decimal place.
        dynamic_descriptor:
          type: string
          description: A short reference/descriptor that will show against the customers order
        merchant_reference:
          type: string
          description: A reference specified by the merchant to identify the transaction. Please ensure the reference is unique per transaction.
        locale:
          type: string
          description: Language UTF-8 locale code. e.g. en_GB and en_US
        customer_ip:
          type: string
          description: The IP address of the customer
        user_agent:
          type: string
          description: The full user agent string of the device the customer used to submit the transaction
        webhook_transaction_update:
          type: string
          description: 'A webhook url that is called when a transaction is updated. Note: This overrides any URL set on the account'
        shopper_interaction:
          type: string
          description: Determines the point of sale of a customer.
          enum:
          - ecommerce
          - pos
          - unknown
        status:
          type: string
          description: Status of the transaction.
          enum:
          - AUTHORISED
          - CAPTURED
          - DECLINED
        bnpl:
          description: Buy Now Pay Later provider details
          $ref: '#/components/schemas/BNPL_'
        items:
          type: array
          items:
            $ref: '#/components/schemas/Items_'
        customer:
          description: Customer Details
          $ref: '#/components/schemas/Customer_'
        billing_address:
          description: Billing address details for the customer
          $ref: '#/components/schemas/Billing_Address'
        delivery_address:
          description: Delivery address for the order
          $ref: '#/components/schemas/BNPL_DeliveryAddress'
        risk_data:
          description: Risk Data
          $ref: '#/components/schemas/Risk_Data'
        travel_data:
          description: Travel data - data relating to hotel bookings, cruise/trip details/car rental/accomodation rental
          $ref: '#/components/schemas/BNPL_TravelData'
        errors:
          type: array
          description: Gateway Errors
          items:
            $ref: '#/components/schemas/PspErrorDTO'
        duplicate_check:
          type: string
          description: ' This indicates the system whether to perform duplicate check on the transaction or not. A request is considered duplicate if the merchant_reference has already '
          enum:
          - 'true'
          - 'false'
        created_at:
          type: string
          description: The time at which the transaction was created
        last_status_update:
          type: string
          description: The last time when the status of the transaction was updated
        trace_id:
          type: string
          description: Transaction log ID
    FailureResponseDTO:
      type: object
      properties:
        _id:
          type: string
          description: This is the unique transaction id generated by Apexx.
        organisation_id:
          type: string
          description: The ID of an organisation.
        code:
          type: string
          description: An alphanumeric code which uniquely identify an error.
        status:
          type: string
          description: It will indicate what is the final result of the request.
        message:
          type: string
          description: A description of the response.
        timestamp:
          type: integer
          format: int64
          description: Current timestamp.
        details:
          type: string
          description: Optional details concerning the error.
        errors:
          type: array
          description: Details of each error occured.
          items:
            $ref: '#/components/schemas/Errors'
        trace_id:
          type: string
          description: Unique trace id created by APEXX platform to trace this request.
        merchant_reference:
          type: string
          description: A reference specified by the merchant to identify the transaction. Please ensure the reference is unique per transaction.
    OrderDeliveryData:
