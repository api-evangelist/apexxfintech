        end_date:
          type: string
          description: The end date of the subscription, 10 characters, ISO-8601 (YYYY-MM-DD)
        auto_renew:
          type: string
          description: 'Valid values: "true", "false"'
        interval:
          type: string
          description: 'Valid values: "DAILY", "WEEKLY", "MONTHLY", "QUARTERLY", "ANNUALLY"'
        count:
