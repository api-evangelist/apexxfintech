        salutation:
          type: string
          description: Salutation of the customer e.g. "Mr", "Mrs", "Dr", etc.
        first_name:
          type: string
          description: First name of the passenger
        last_name:
          type: string
          description: Last name of the passenger
        date_of_birth:
          type: string
          description: 'D.O.B. of passenger. Format: YYYY-MM-DD'
    BNPLOrderResponse:
      type: object
      properties:
        payment_flow:
          type: string
