openapi: 3.2.0
info:
  description: '# Using the API


    ## Authentication

    Authentication is managed using an API key, which is provided to you.'
  version: '2.0'
  title: APEXX FINTECH Transaction Payment API
  license:
    name: Apexx Fintech Ltd
    url: https://www.apexxfintech.com/legal-documentation/
servers:
- url: https://sandbox.apexx.global/atomic/v1/
tags:
- name: Transaction Payment
paths:
  /api/3ds/authenticate:
    post:
      tags:
      - Transaction Payment
      summary: 3DS Verify Authentication Request
      description: Verifies 3DS Authentication. This verifies if the 3DS enrolled card was authenticated and proceeds with the payment authorisation after successful 3DS Authentication.
      operationId: threeDsVerifyAuthUsingPOST
      parameters:
      - name: X-APIKEY
        in: header
        description: X-APIKEY
        required: true
        schema:
          type: string
      - name: ORG-ID
        in: header
        description: ORG-ID
        required: true
        schema:
          type: string
      responses:
        '200':
          description: JSON representation of the related transaction
          content:
            '*/*':
              schema:
                $ref: '#/components/schemas/ThreeDsAuthenticationResponse'
        '400':
          description: "Bad / Invalid request\t"
          content:
            '*/*':
              schema:
                $ref: '#/components/schemas/FailureResponseDTO'
        '401':
          description: Unauthenticated user / missing API Key
          content:
            '*/*':
              schema:
                $ref: '#/components/schemas/FailureResponseDTO'
        '403':
          description: Forbidden error
          content:
            '*/*':
              schema:
                $ref: '#/components/schemas/FailureResponseDTO'
        '412':
          description: Processing Errors
          content:
            '*/*':
              schema:
                $ref: '#/components/schemas/ThreeDsAuthenticationFailResponse'
        '500':
          description: Internal Server Error / Unexpected Error
          content:
            '*/*':
              schema:
                $ref: '#/components/schemas/FailureResponseDTO'
        '503':
          description: Service Unavailable
          content:
            '*/*':
              schema:
                $ref: '#/components/schemas/FailureResponseDTO'
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ThreeDsVerifyAuthRequestDTO'
        description: ' '
  '/api/payment  ':
    post:
      tags:
      - Transaction Payment
      summary: Encrypted Card Transaction
      description: Starts a new transaction with encrypted payload
      operationId: encryptedCardTransactionUsingPOST
      parameters:
      - name: EncryptedKey
        in: header
        description: Required when request body is encrypted
        required: true
        schema:
          type: string
      responses:
        '200':
          description: JSON representation of the related transaction
          content:
            '*/*':
              schema:
                $ref: '#/components/schemas/ThreeDsAuthenticationResponse'
        '400':
          description: "Bad / Invalid request\t"
          content:
            '*/*':
              schema:
                $ref: '#/components/schemas/FailureResponseDTO'
        '401':
          description: Unauthenticated user / missing API Key
          content:
            '*/*':
              schema:
                $ref: '#/components/schemas/FailureResponseDTO'
        '403':
          description: Forbidden error
          content:
            '*/*':
              schema:
                $ref: '#/components/schemas/FailureResponseDTO'
        '412':
          description: Processing Errors
          content:
            '*/*':
              schema:
                $ref: '#/components/schemas/ThreeDsAuthenticationFailResponse'
        '500':
          description: Internal Server Error / Unexpected Error
          content:
            '*/*':
              schema:
                $ref: '#/components/schemas/FailureResponseDTO'
        '503':
          description: Service Unavailable
          content:
            '*/*':
              schema:
                $ref: '#/components/schemas/FailureResponseDTO'
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/EncryptedCardDTO'
        description: '  '
  '/api/payment   ':
    post:
      tags:
      - Transaction Payment
      summary: Authorises Payment Request
      description: Authorise Payment Request. This provides a single interface for APM, Card and other payment methods. Method accepts payment request in encrypted or in clear text. In all cases Organisation and Currency or Account is required.
      operationId: authorizePaymentRequestUsingPOST
      parameters:
      - name: X-APIKEY
        in: header
        description: X-APIKEY
        required: true
        schema:
          type: string
      responses:
        '200':
          description: JSON representation of the related transaction
          content:
            '*/*':
              schema:
                $ref: '#/components/schemas/ThreeDsAuthenticationResponse'
        '400':
          description: "Bad / Invalid request\t"
          content:
            '*/*':
              schema:
                $ref: '#/components/schemas/FailureResponseDTO'
        '401':
          description: Unauthenticated user / missing API Key
          content:
            '*/*':
              schema:
                $ref: '#/components/schemas/FailureResponseDTO'
        '403':
          description: Forbidden error
          content:
            '*/*':
              schema:
                $ref: '#/components/schemas/FailureResponseDTO'
        '412':
          description: Processing Errors
          content:
            '*/*':
              schema:
                $ref: '#/components/schemas/ThreeDsAuthenticationFailResponse'
        '500':
          description: Internal Server Error / Unexpected Error
          content:
            '*/*':
              schema:
                $ref: '#/components/schemas/FailureResponseDTO'
        '503':
          description: Service Unavailable
          content:
            '*/*':
              schema:
                $ref: '#/components/schemas/FailureResponseDTO'
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PaymentRequest'
        description: ' '
components:
  schemas:
    BillingAddress:
      type: object
      properties:
        first_name:
          type: string
          description: First name of the card holder.
        last_name:
          type: string
          description: Last name of the card holder.
        email:
          type: string
          description: 'Email address of the card holder.


            Note: Only alphabets, numeric, @, comma(,) dot(.), plus(+), underscore(_), dash(-) and apostrophe(â€˜)'
        address:
          type: string
          description: Street address of the card holder.
        city:
          type: string
          description: City of the card holder.
        state:
          type: string
          description: A region / state / province for the address.
        postal_code:
          type: string
          description: 'A postal code for the address.


            Note: Only alpha-numeric characters, Special characters allowed are hyphen(-) and spaces.'
        country:
          type: string
          description: "A 2-letter ISO3166 alpha-2. country code for the address. \n\nNote: Alphabets upto two characters (e.g. GB, RU etc..)"
        phone:
          type: string
          description: 'Numbers only, no dash or any other separator.


            Note: Length - min(3) & max(20)'
    VehicleInformation:
      type: object
      properties:
        identification_number:
          type: string
          description: This field contains a unique identifier assigned by the company to the vehicle.
        vehicle_make:
          type: string
          description: Make of the vehicle being rented (e.g., Chevrolet or Ford).
        vehicle_class:
          type: string
          description: Classification of the rented auto.
          enum:
          - MINI
          - SUBCOMPACT
          - ECONOMY
          - COMPACT
          - MIDSIZE
          - INTERMEDIATE
          - STANDARD
          - FULL_SIZE
          - LUXURY
          - PREMIUM
          - MINIVAN
          - VAN_12_PASSENGERS
          - MOVING_VAN
          - VAN_15_PASSENGERS
          - CARGO_VAN
          - TRUCK_12_FOOT
          - TRUCK_20_FOOT
          - TRUCK_24_FOOT
          - TRUCK_26_FOOT
          - MOPED
          - STRETCH
          - REGULAR
          - UNIQUE
          - EXOTIC
          - SMALL_OR_MEDIUM_TRUCK
          - LARGE_TRUCK
          - SMALL_SUV
          - MEDIUM_SUV
          - LARGE_SUV
          - EXOTIC_SUV
          - MISCELLANEOUS
    RuleDTO:
      type: object
      properties:
        decision:
          type: string
        name:
          type: string
    PspgwRouteInformation:
      type: object
      properties:
        apexx_name:
          type: string
          description: Name of the psp as setup within the APEXX payment gateway.
        merchant_code:
          type: string
        name:
          type: string
        psp_id:
          type: string
          description: The ID of the payment service provider.
        sequence:
          type: integer
          format: int32
    CardDetailsWithApm:
      type: object
      properties:
        card_holder_name:
          type: string
          description: Name of the card holder as printed on the card.
        card_number:
          type: string
          description: The new card number, also known as PAN.
        cvv:
          type: string
          description: 'The Card Verification Value. Note: CVV is not required when transaction is a recurring or oneclick transaction.'
        expiry_month:
          type: string
          description: Card expiry month. A string representing the month, valid values are 01 to 12.
        expiry_year:
          type: string
          description: Card expiry year. A string representing the last two digits of the year, e.g. 19 for 2019.
        token:
          type: string
          description: The token representing the payment card.
        create_token:
          type: string
          description: Whether to create a token or not for the card. Defaults to 'false'. Setting it to 'true' will create the token for the card.
        encrypted_data:
          type: string
          description: This field will contain the encryption data of card_number, expiry_month, expiry_year and cvv fields. Encryption data generated by client-side-encryption SDK.
        tokenise_status:
          type: string
          description: Status of the transactions when cards should be tokenised.
          enum:
          - AUTHORISED
          - CAPTURED
          - FAILED
          - DECLINED
        initial_scheme_transaction_id:
          type: string
          description: The unique scheme transaction Id returned during customer initiated transaction. This value will be required when recurring_type is "mit"
        googlepay:
          description: GooglePay
          $ref: '#/components/schemas/GooglePay'
        applepay:
          description: ApplePay
          $ref: '#/components/schemas/ApplePay'
        network_token:
          description: Network token.
          $ref: '#/components/schemas/NetworkToken'
    ThreeDsAuthenticationFailResponse:
      type: object
      required:
      - amount
      - card
      - merchant_reference
      properties:
        _id:
          type: string
          description: This is the unique id generated by Apexx.
        account:
          type: string
          description: The ID of the account. Acts as an override. Must be submitted if organisation and currency are not used in the request.
        organisation:
          type: string
          description: The ID of an organisation. Must be submitted along with currency if account is not used in the request.
        currency:
          type: string
          description: Currency using which transaction needs to be processed. Must be submitted if account is not used in the request. This field is ignored if submitted along with the account, Apexx uses the currency configured with the account to process the transaction when account is submitted. A 3-letter ISO 4217 currency code, see Currencies Section for more details.
        amount:
          type: string
          description: Amount is charged without a decimal place e.g. $1.50 = 150. Currencies can have different decimals/exponentials, see Currencies Section for more details.
        authorization_code:
          type: string
          description: An authorisation code assigned by the processing platform
        blocked:
          type: boolean
          example: false
          description: True if the transaction has been blocked by a ruleset, false otherwise
        capture_now:
          type: string
          description: True will auto-capture the transaction. False will only authorise the transaction.
        dynamic_descriptor:
          type: string
          description: A short reference/descriptor that will show up on the customers bank statement. Only supported by some acquirers. Please confirm with your Implementation Manager for supported acquirers and formats.
        card:
          description: The new card number, also known as PAN.
          $ref: '#/components/schemas/RiskCheckCardDetails'
        merchant_reference:
          type: string
          description: A reference specified by the merchant to identify the transaction. Please ensure the reference is unique per transaction.
        customer_ip:
          type: string
          description: The IP address of the customer
        pares:
          type: string
          description: The unmodified PaRes value as received after the customer was redirected back from 3DS Authentication.
        recurring_type:
          type: string
          description: The value used to flag how the acquirer/ issuer should consider the transaction
          enum:
          - first
          - recurring
          - oneclick
          - mit
          - cit
          - install
        user_agent:
          type: string
          description: The full user agent string of the device the customer used to submit the transaction
        webhook_transaction_update:
          type: string
          description: 'A webhook url that is called when a transaction is updated. Note: This overrides any URL set on the account'
        actions:
          type: array
          items:
            type: string
        created_at:
          type: string
          description: The time at which the transaction was created
        cvv_present:
          type: boolean
          example: false
          description: True if the card was used with a cvv
        fees:
          type: array
          items:
            type: integer
            format: int32
        geo_locations:
          type: array
          description: The latitude/longitude resolved from the customer's ip address
          items:
            type: integer
            format: int32
        fraud_predictions:
          type: array
          items:
            $ref: '#/components/schemas/FraudPredictions'
        last_status_update:
          type: string
          description: The last time when the status of the transaction was updated
        card_brand:
          type: string
          description: Card brand for the card used for processing
          enum:
          - amex
          - diners
          - discover
          - elo
          - jcb
          - maestro
          - mastercard
          - visa
          - visa electron
          - carte bancaire
        issuer_name:
          type: string
          description: Card Issuer Name for this transaction
        delivery_address:
          description: Some fields may be mandatory for certain acquirers. Please speak to your Implementation Manager for further information.
          $ref: '#/components/schemas/deliveryAddress'
        issuer_country:
          type: string
          description: Issuing country of the card. A 2-letter ISO3166 alpha-2. Acquirer country code
        organisation_psp_name:
          type: string
          description: The name of the processor as setup within the APEXX payment gateway. i.e. Merchant Name - Acquirer Name
        reason_code:
          type: string
          description: A reason code assigned by the acquiring platform; '0' in case of AUTHORISED/CAPTURED, see **[reason codes](#section/Appendix)** section for declined scenarios and **[error codes](#section/Appendix)** section for failed scenarios.
        reason_message:
          type: string
          description: A reason message assigned by the acquiring platform. Reason message will return if reason_code is not 0
        status:
          type: string
          description: Status of the transaction.
          enum:
          - FAILED
        details:
          $ref: '#/components/schemas/Details'
        payment product = "card":
          type: string
          description: The payment product corresponding to this transaction
        billing_address:
          description: Billing address details for the customer
          $ref: '#/components/schemas/BillingAddress'
        shopper_interaction:
          type: string
          description: Determines the point of sale of a customer.
          enum:
          - ecommerce
          - pos
          - moto
          - unknown
        cvv_result:
          type: string
          description: CVV verification result, as returned by the processor.
        avs_result:
          type: string
          description: Address verification services result, as returned by the processor
        three_ds:
          description: Enroll a given transaction for 3D-secure to verify whether authentication is supported for the card being used.
          $ref: '#/components/schemas/ThreeDSCardEnrolRequest'
        acquirer_name:
          type: string
          description: The name of the acquirer as setup within the APEXX payment gateway.
        merchant_data:
          description: Merchant Data
          $ref: '#/components/schemas/MerchantData'
        cascade_successful:
          type: boolean
          example: false
          description: True if the transaction was cascaded, false if transaction when transaction failed to cascade and null if cascading was not attempted.
        device_information:
          description: deviceInformation
          $ref: '#/components/schemas/deviceInformation'
        webhook:
          description: WebhookResponse
          $ref: '#/components/schemas/WebhookResponse'
        preauth_check:
          $ref: '#/components/schemas/PreauthCheck'
        external_risk_data:
          description: ExternalRiskData
          $ref: '#/components/schemas/FraudCheckResponse'
        routing:
          type: array
          description: RouteInformation
          items:
            $ref: '#/components/schemas/PspgwRouteInformation'
        cascaded_psps:
          type: array
          description: Cascaded psp's
          items:
            $ref: '#/components/schemas/PspInformation'
        psp_info:
          description: PspInformation
          $ref: '#/components/schemas/PspInformation'
        tra_exemption:
          type: string
          description: "\"This indicates that exemption from SCA is requested for the transaction. Valid values as mentioned below:\n\n \"\"external\"\" - Transaction risk analysis conducted by approved external source\n\n \"\"acquirer\"\" - Transaction risk analysis conducted by the acquirer\n\n \"\"scp\"\" - scp stands for Secure Corporate Payment\n\n \"\"lvp\"\" - lvp stands for Low-Value Payment\n\n \"\"delegated\"\" - Exemption indicator for delegated authentication.\n\n This flag specifies whether the transaction is exempt from strong customer authentication (SCA) requirements in Europe because the authentication was delegated to a different provider, such as an acquirer or payment technology provider (PTP).\""
        authorisation_mid:
          type: string
          description: The authorisation mid used to process the transaction as setup within the APEXX payment gateway.
        settlement_mid:
          type: string
          description: The settlement mid used to process the transaction as setup within the APEXX payment gateway.
        pos_data_code:
          type: string
        request_id:
          type: string
          description: Unique Id for each request.
        duplicate_check:
          type: string
          description: This is the duplicate check of request, 'true' in case of request is duplicate
        customer:
          description: customer
          $ref: '#/components/schemas/AuthorisePaymentCustomer'
        response_code:
          type: string
          description: Response code is sent only when the source of the response looks suspicious. In this case Apexx immediately cancels the transaction placed with the gateway.
        airline_data:
          description: airlineData
          $ref: '#/components/schemas/airlineData'
        travel_data:
          description: Travel data - data relating to hotel bookings, cruise/trip details/car rental/accomodation rental
          $ref: '#/components/schemas/travelData'
        payment_product_type:
          type: string
          description: The payment product type corresponding to this transaction
          enum:
          - Amex
          - Diners Club International
          - Discover
          - Elo
          - JCB
          - Maestro
          - Mastercard
          - Visa
          - Visa Electron
        response_message:
          type: string
          description: A description of the response_code.
        transaction_chargeback:
          description: TransactionChargeback
          $ref: '#/components/schemas/TransactionChargeback'
        card_type:
          type: string
          description: Funding type of the card e.g. Debit, Credit
        mastercard_settlement_date:
          type: string
          description: Mastercard settlement date received from Acquirer
        aft_type:
          type: string
          description: 'Type of Account Funding transaction.


            SVWF - Stored value wallet funding


            SDWT - Staged digital wallet pre-funding


            A2A - Account-to-account (me-to-me) money transfer


            P2P - Person-to-Person (P2P) money transfer


            CLA - Cryptocurrency and liquid assets


            BIT - Financial Institution offe red Bank-Initiated P2P Money Transfer


            FD - Funds Disbursement


            FT - Funds Transfer


            PD - Payroll Disbursement


            PL - Prepaid load / reload2


            B2B - Business to Business


            CBP - Card Bill Payment


            GP - Gambling Payouts


            GFD - General funds disbursement


            GD - Government Disbursement


            LP - Loyalty Payments


            MD - Funding small business disbursements


            MP - Merchant Payment


            NCBP - Non card bill payment


            OGP - Online gaming payout


            ZDA - Zero dollar authorisation


            TO - Top off'
          enum:
          - SVWF
          - SDWT
          - A2A
          - P2P
          - CLA
          - BIT
          - FD
          - FT
          - PD
          - TPL
          - B2BCBP
          - GP
          - GFD
          - GD
          - LP
          - MD
          - MP
          - NCBP
          - OGP
          - ZDA
          - TO
        installment_information:
          description: Please note that the specific request here will override any general configuration that is set against your MID. by the acquirer. This does not apply to AMEX where the config at the MID takes priority
          $ref: '#/components/schemas/InstallmentInformation'
    Car:
      type: object
      properties:
        program_code:
          type: string
          description: 'Used to identify special circumstances applicable to the Card Transaction or Cardholder, such as "renter” or ”show”

            This code is 2 digit value agreed by Merchant and processor.'
        rental_information:
          description: Auto rental information
          $ref: '#/components/schemas/RentalInformation'
        driver_age:
          type: integer
          format: int32
          description: Age of the driver renting the vehicle.
        number_of_additional_drivers:
          type: integer
          format: int32
          description: The number of additional drivers included on the rental agreement not including the individual who signed the rental agreement.
        vehicle_information:
          description: Rented vehicle information
          $ref: '#/components/schemas/VehicleInformation'
        max_free_distance:
          type: string
          description: Maximum number of free miles or kilometers allowed to a customer for the duration of the auto rental agreement.
        insurance_indicator:
          type: boolean
          example: false
          description: 'Insurance purchased

            true - Yes (insurance was purchased)

            false - No (insurance was not purchased)'
        distance:
          description: Details on the distance of the auto rental
          $ref: '#/components/schemas/Distance'
        odometer_reading:
          type: string
          description: Odometer reading at time of vehicle rental.
        tax_details:
          type: array
          description: Tax details of the auto rental
          items:
            $ref: '#/components/schemas/CarTaxDetail'
        rental_charges:
          description: Rental charges information
          $ref: '#/components/schemas/RentalCharges'
        company_name:
          type: string
          description: Merchant to send their auto rental company name
        affiliate_name:
          type: string
          description: When merchant wants to send the affiliate name.
    RentalCharges:
      type: object
      properties:
        one_waydrop_off_amount:
          type: string
          description: Extra charges incurred for a one-way rental agreement for the auto.
        adjusted_amount:
          description: Adjusted amount details
          $ref: '#/components/schemas/AdjustedAmount'
        fuel_charges:
          type: string
          description: Extra gasoline charges that extend beyond the basic rental agreement
        weekly_rental_rate:
          type: string
          description: 'Weekly Rental Amount provides the amount charged for a seven-day rental period.

            Time Period needs to be populated with Weekly if this field is present'
        daily_rental_rate:
          type: string
          description: 'Daily auto rental rate charged.

            Time Period needs to be populated with Daily if this field is present'
        rate_per_mile:
          type: string
          description: Rate charged for each mile.
        mileage_charge:
          type: string
          description: Regular Mileage Charge provides the amount charged for regular miles travelled during vehicle rental. Two decimal places
        extra_mileage_charge:
          type: string
          description: Extra mileage charges that extend beyond the basic rental agreement.
        late_fee_amount:
          type: string
          description: Extra charges related to a late return of the rented auto
        towing_charge:
          type: string
          description: Towing Charges provides the amount charged to tow the rental vehicle.
        extra_charge:
          type: string
          description: Extra Charges provides the extra charges associated with the vehicle rental.
        gps_charge:
          type: string
          description: Amount charged for renting a Global Positioning Service (GPS).
        phone_charge:
          type: string
          description: Additional charges incurred for phone usage included on the total bill.
        parking_violation_charge:
          type: string
          description: Extra charges incurred due to a parking violation for the auto.
        other_charges:
          type: string
          description: Total amount charged for all other miscellaneous charges not previously defined.
    InstallmentInformation:
      type: object
      properties:
        plan_type:
          type: string
          description: "Flag that indicates the type of funding for the installment plan associated with the payment. \n\n This is an optional field for most processors; however, it is mandatory if your processor is PROSA. Please speak to your Implementation Manager for further information."
          enum:
          - merchant funded
          - issuer funded
          - non promotion
          - skip payment
        total_count:
          type: integer
          format: int32
          description: Total number of installments when making payments in installments.
        sequence:
          type: string
          description: Sequence of installment transaction.
        amount:
          type: string
          description: Amount is charged without a decimal place e.g. $1.50 = 150. Currencies can have different decimals/exponentials, see Currencies Section for more details.
        frequency:
          type: string
          description: Frequency of installment transaction.
          enum:
          - 'B : Biweekly'
          - 'M : Monthly'
          - 'W : Weekly'
    Hotel:
      type: object
      properties:
        room:
          description: The object containing the number of nights and the daily rate that applies for that number of nights.
          $ref: '#/components/schemas/Room'
        charge:
          description: 'Indicates the type of charge if it is for an airline ticket or another type of expense. 01: Charge is for an airline ticket. 02: Charge is for an item that is not an airline ticket'
          $ref: '#/components/schemas/Charge'
        tax_detail:
          type: array
          description: Hotel tax details
          items:
            $ref: '#/components/schemas/TaxDetail'
        additional_discount_amount:
          type: string
          description: Amount of an additional coupon or discount.
        adjusted_amount:
          type: string
          description: Adjusted amount charged in addition to the reservation amount after the stay is complete.
    AuthorisePaymentCustomer:
      type: object
      properties:
        account_number:
          type: string
          description: This is the recipient's account number.
        customer_id:
          type: string
          description: The customer_id of recipient's.
        date_of_birth:
          type: string
          description: The date of birth of a customer, 10 characters, ISO-8601 (YYYY-MM-DD).
        last_name:
          type: string
          description: Last name of the customer.
        postal_code:
          type: string
          description: 'This is the recipient''s postcode/zip.


            Note: Only alpha-numeric characters, Special characters allowed are hyphen(-) and single space'
    PspInformation:
      type: object
      properties:
        routing_sequence_id:
          type: integer
          format: int32
        psp_id:
          type: string
