        airline_data:
          description: airlineData
          $ref: '#/components/schemas/airlineData'
        external_authentication:
          description: ExternalAuthentication
          $ref: '#/components/schemas/ExternalAuthentication'
        tra_exemption:
          type: string
          description: "\"This indicates that exemption from SCA is requested for the transaction. Valid values as mentioned below:\n\n \"\"external\"\" - Transaction risk analysis conducted by approved external source\n\n \"\"acquirer\"\" - Transaction risk analysis conducted by the acquirer\n\n \"\"scp\"\" - scp stands for Secure Corporate Payment\n\n \"\"lvp\"\" - lvp stands for Low-Value Payment\n\n \"\"delegated\"\" - Exemption indicator for delegated authentication.\n\n This flag specifies whether the transaction is exempt from strong customer authentication (SCA) requirements in Europe because the authentication was delegated to a different provider, such as an acquirer or payment technology provider (PTP).\""
        merchant_data:
          description: Merchant Data
          $ref: '#/components/schemas/MerchantData'
        installment_information:
          description: Please note that the specific request here will override any general configuration that is set against your MID. by the acquirer. This does not apply to AMEX where the config at the MID takes priority
          $ref: '#/components/schemas/InstallmentInformation'
        travel_data:
