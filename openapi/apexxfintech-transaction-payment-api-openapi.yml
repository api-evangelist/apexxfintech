          type: boolean
          example: false
          description: 'Card’s enrollment status.


            **Note:** This field is required by certain acquirers, please ask your implementation manager for details.'
        three_ds_required:
          type: string
          description: Enroll a given transaction for 3D-secure to verify whether authentication is supported for the card being used.
        three_ds_version:
          type: string
          description: The 3-D Secure version used for the authentication.
          enum:
          - '1.0'
          - '2.0'
          - 1.0.2
          - 2.1.0
          - 2.2.0
        term_url:
          type: string
          description: The return url to which the customer is redirected after a transaction is processed.
        eci:
          type: string
          description: The Electronic Commerce Indicator (ECI).
        xid:
          type: string
          description: 3-D Secure X id.
        cavv:
          type: string
          description: 3-D Secure "Cardholder Authentication Verification Value"
        pares:
          type: string
          description: 'Result of the authentication check. This field can contain one of these values:


            A: Proof of authentication attempt was generated.


            N: Customer failed or canceled authentication. Transaction denied.


            U: Authentication not completed regardless of the reason.


            Y: Customer was successfully authenticated.'
        veres:
          type: string
          description: 'Result of the enrollment check. This field can contain one of these values:


            Y: Card enrolled or can be enrolled; you must authenticate. Liability shift.


            N: Card not enrolled; proceed with authorization. Liability shift.


            U: Unable to authenticate regardless of the reason. No liability shift.


            B: Indicates that authentication was bypassed.'
        authentication_result:
          type: string
          description: 'Raw authentication data that comes from the cardissuing bank. Primary authentication field that indicates if authentication was successful and if liability shift occurred. You should examine first the result of this field. This field contains one of these values:


            -1: Invalid PARes.


            0: Successful validation.


            1: Cardholder is not participating, but the attempt to authenticate was recorded.


            6: Issuer unable to perform authentication.


            9: Cardholder did not complete authentication.'
